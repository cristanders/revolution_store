<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolution Store | Customer Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #f9f6f2;
            --terracotta: #e76f51;
            --deep-onyx: #1a1a1a;
            --pure-white: #ffffff;
            --border: rgba(26, 26, 26, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            color: var(--deep-onyx);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            background: var(--pure-white);
            border: 1px solid var(--border);
            border-radius: 28px;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-header p {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--terracotta);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-style: italic;
            font-weight: 700;
        }

        .grid-campos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo { margin-bottom: 20px; }
        .full-width { grid-column: span 2; }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #666;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg-cream);
            transition: 0.3s;
            outline: none;
        }

        input:focus { border-color: var(--terracotta); background: white; }

        .error {
            color: #ef4444;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .btn-group {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
            text-align: center;
            text-decoration: none;
            border: none;
        }

        .btn-save { background: var(--deep-onyx); color: white; }
        .btn-save:hover { background: var(--terracotta); transform: translateY(-2px); }

        .btn-cancel { color: #888; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="form-card">
    <header class="form-header">
        <p>Data Management</p>
        <h2 th:text="${customer.dpiCustomer != null} ? 'Edit Profile' : 'New Customer'">Customer</h2>
    </header>

    <form th:action="@{/customers/save}" th:object="${customer}" method="post">


        <input type="hidden" th:field="*{dpiCustomer}">

        <div class="grid-campos">
            <div class="campo">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}" placeholder="First Name">
                <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>

            <div class="campo">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}" placeholder="Last Name">
                <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>

            <div class="campo full-width">
                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}" placeholder="Residential Address">
                <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>

            <div class="campo full-width">
                <label for="statusCustomer">Customer Status</label>
                <select id="statusCustomer" th:field="*{statusCustomer}">
 
                    <option th:each="status : ${T(com.cristianperez.revolutionstore.enums.StatusCustomerEnum).values()}"
                            th:value="${status.name()}"
                            th:text="${status}">
                    </option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('statusCustomer')}" th:errors="*{statusCustomer}"></div>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-save">Save Changes</button>
            <a th:href="@{/customers}" class="btn btn-cancel">Go Back</a>
        </div>
    </form>
</div>

</body>
</html>
