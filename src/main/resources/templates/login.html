<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolution Store | Client Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@200;400;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #f9f6f2;
            --mint-wash: #a8dadc;
            --terracotta: #e76f51;
            --deep-onyx: #1a1a1a;
            --pure-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            color: var(--deep-onyx);
            min-height: 100vh;
            display: flex;
            align-items: stretch;
        }

        /* Visual Side: Editorial Fashion Style */
        .side-visual {
            flex: 1.2;
            background: var(--terracotta);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 80px;
            position: relative;
            overflow: hidden;
        }

        .side-visual h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 7vw;
            color: var(--pure-white);
            line-height: 0.85;
            font-style: italic;
            z-index: 2;
            letter-spacing: -3px;
        }

        /* Organic overlay to break the "AI" symmetry */
        .side-visual::after {
            content: '';
            position: absolute;
            top: -5%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: var(--mint-wash);
            border-radius: 50%;
            mix-blend-mode: multiply;
            opacity: 0.4;
        }

        /* Form Side: Clean Retail Interface */
        .side-form {
            width: 40%;
            background: var(--pure-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
            position: relative;
        }

        .form-header {
            margin-bottom: 60px;
        }

        .form-header h2 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .input-wrapper {
            margin-bottom: 35px;
        }

        .input-wrapper label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--deep-onyx);
            letter-spacing: 1px;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            padding: 12px 0;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-bottom: 2px solid var(--terracotta);
            padding-left: 5px;
        }

        /* Button: High-Contrast Action */
        .btn-submit {
            width: 100%;
            background: var(--deep-onyx);
            color: var(--pure-white);
            padding: 22px;
            border: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .btn-submit:hover {
            background: var(--terracotta);
            letter-spacing: 4px;
        }

        .register-link {
            margin-top: 50px;
            display: block;
            text-align: center;
            text-decoration: none;
            color: var(--deep-onyx);
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid var(--deep-onyx);
            padding: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .register-link:hover {
            background: var(--bg-cream);
            border-color: transparent;
        }

        /* Minimalist Feedback Messages */
        .alert {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 18px;
            margin-bottom: 40px;
            border-left: 3px solid var(--terracotta);
            background: #fffafa;
            color: var(--terracotta);
        }

        .alert-success {
            border-left-color: var(--mint-wash);
            background: #f7fdfd;
            color: #4a7c7e;
        }

        /* Branding corner detail */
        .brand-seal {
            position: absolute;
            bottom: 40px;
            left: 8%;
            font-size: 0.6rem;
            font-weight: 800;
            opacity: 0.3;
        }

        @media (max-width: 1100px) {
            .side-visual { display: none; }
            .side-form { width: 100%; padding: 60px 10%; }
        }
    </style>
</head>
<body>

<section class="side-visual">
    <h1>The<br>Revolution<br>Store.</h1>
</section>

<section class="side-form">
    <div class="form-header">
        <h2>SIGN IN</h2>
        <p>Spring / Summer 2026 Collection</p>
    </div>

    <div th:if="${param.error}" class="alert">
        The credentials provided do not match our records.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have been successfully signed out. See you soon.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="input-wrapper">
            <label>Username or Email</label>
            <input type="text" id="username" name="username" placeholder="Enter your identity" required>
        </div>

        <div class="input-wrapper">
            <label>Access Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Enter Store</button>
    </form>

    <a th:href="@{/register}" class="register-link">Create an Account</a>

    <div class="brand-seal">© 2026 REVOLUTION RETAIL GROUP</div>
</section>

</body>
</html>
