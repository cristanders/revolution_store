<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolution Store | Edit Product</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #f9f6f2;
            --terracotta: #e76f51;
            --deep-onyx: #1a1a1a;
            --pure-white: #ffffff;
            --border: rgba(26, 26, 26, 0.1);
            --mint-wash: #a8dadc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            color: var(--deep-onyx);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--pure-white);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center;
        }

        .badge-edit {
            display: inline-block;
            background: var(--mint-wash);
            color: #2d6a4f;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-style: italic;
            font-weight: 700;
            color: var(--deep-onyx);
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #888;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 35px;
        }

        .campo { margin-bottom: 24px; text-align: left; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 800;
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background-color: var(--bg-cream);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--terracotta);
            background-color: var(--pure-white);
        }

        .error {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 6px;
            font-weight: 600;
        }

        .acciones {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .btn-update {
            background: var(--deep-onyx);
            color: white;
        }

        .btn-update:hover {
            background: var(--terracotta);
            transform: translateY(-2px);
        }

        .btn-cancelar {
            background-color: transparent;
            color: #888;
            font-size: 0.75rem;
        }

        .btn-cancelar:hover {
            color: var(--deep-onyx);
        }
    </style>
</head>

<body>

<div class="container">
    <span class="badge-edit">Authorized Access</span>
    <h1>Update Item.</h1>
    <p class="subtitulo">Refine the product specifications in the registry</p>

    <form th:action="@{/products/save}" th:object="${product}" method="post">

        <!-- ID Oculto -->
        <input type="hidden" th:field="*{codeProduct}">

        <div class="campo">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" th:field="*{productName}" placeholder="Name">
            <div class="error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="campo">
                <label for="priceProduct">Price (Q)</label>
                <input type="number" step="0.01" id="priceProduct" th:field="*{priceProduct}">
                <div class="error" th:if="${#fields.hasErrors('priceProduct')}" th:errors="*{priceProduct}"></div>
            </div>

            <div class="campo">
                <label for="stockProduct">Stock</label>
                <input type="number" id="stockProduct" th:field="*{stockProduct}">
                <div class="error" th:if="${#fields.hasErrors('stockProduct')}" th:errors="*{stockProduct}"></div>
            </div>
        </div>

        <!-- Mantenemos el estado activo/inactivo con el estilo nuevo -->
        <div class="campo" style="display: flex; gap: 10px; align-items: center; background: var(--bg-cream); padding: 12px; border-radius: 12px;">
            <input type="checkbox" th:field="*{statusProduct}" id="status" style="width: 18px; height: 18px; accent-color: var(--terracotta);">
            <label for="status" style="margin: 0; cursor: pointer;">Active in Revolution</label>
        </div>

        <div class="acciones">
            <button type="submit" class="btn btn-update">Commit Changes</button>
            <a th:href="@{/products}" class="btn-cancelar">Discard and Back</a>
        </div>
    </form>
</div>

</body>
</html>
