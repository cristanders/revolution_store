<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modoEdicion} ? 'Revolution Store | Edit' : 'Revolution Store | New'"></title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #f9f6f2;
            --terracotta: #e76f51;
            --deep-onyx: #1a1a1a;
            --pure-white: #ffffff;
            --border: rgba(26, 26, 26, 0.1);
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            color: var(--deep-onyx);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            background: var(--pure-white);
            border: 1px solid var(--border);
            border-radius: 28px;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-header p {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--terracotta);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-style: italic;
            font-weight: 700;
            color: var(--deep-onyx);
        }

        .campo {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #666;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg-cream);
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--terracotta);
            background: var(--pure-white);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-cream);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--terracotta);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        .btn-save {
            background: var(--deep-onyx);
            color: var(--pure-white);
            margin-bottom: 12px;
        }

        .btn-save:hover {
            background: var(--terracotta);
            transform: translateY(-2px);
        }

        .btn-cancel {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #888;
            font-size: 0.75rem;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-cancel:hover {
            color: var(--deep-onyx);
        }

        .error {
            color: var(--error);
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <header class="form-header">
        <p th:text="${modoEdicion} ? 'Update Item' : 'New Entry'"></p>
        <h2 th:text="${modoEdicion} ? 'Edit Product' : 'Create Product'">Form</h2>
    </header>

    <form th:action="@{/products/save}" th:object="${product}" method="post">


        <input type="hidden" th:field="*{codeProduct}">

        <div class="campo">
            <label>Product Name</label>
            <input type="text" th:field="*{productName}" placeholder="enter product">
            <div class="error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="campo">
                <label>Price (Q)</label>
                <input type="number" step="0.01" th:field="*{priceProduct}" placeholder="0.00">
                <div class="error" th:if="${#fields.hasErrors('priceProduct')}" th:errors="*{priceProduct}"></div>
            </div>

            <div class="campo">
                <label>Stock Units</label>
                <input type="number" th:field="*{stockProduct}" placeholder="0">
                <div class="error" th:if="${#fields.hasErrors('stockProduct')}" th:errors="*{stockProduct}"></div>
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" th:field="*{statusProduct}" id="status">
            <label for="status" style="margin: 0; cursor: pointer;">Available in Catalog</label>
        </div>

        <div class="acciones">
            <button type="submit" class="btn btn-save" th:text="${modoEdicion} ? 'Update Product' : 'Save Product'"></button>
            <a th:href="@{/products}" class="btn-cancel">Discard Changes</a>
        </div>
    </form>
</div>

</body>
</html>
